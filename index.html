<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>После родов</title>
<meta name="description" content="Памятка для родильниц: когда звать помощь, можно и нельзя, уход за швами, грудь, после выписки">
<meta name="theme-color" content="#0A5A63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="После родов">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
html{-webkit-tap-highlight-color:transparent}body{margin:0;padding-top:env(safe-area-inset-top,0px)}
/* Layout: one column, phone-first; big tap targets; one red entry point always on top. */
:root{
  --bg:#FFFFFF; --surface:#F1F4F6; --line:#C9D1D8;
  --ink:#0B1620; --ink-2:#26333F;
  --accent:#0A5A63; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --red:#B00F1A; --red-soft:#FDE7E8; --red-ink:#FFFFFF;
  --amber:#7A4300; --amber-soft:#FFF0D6;
  --green:#165E2A; --green-soft:#E1F3E5;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1117; --surface:#15212B; --line:#34444F;
  --ink:#F4F7F9; --ink-2:#DCE3E8;
  --accent:#5FD0D6; --accent-ink:#06232A; --accent-soft:#12343A;
  --red:#FF5A63; --red-soft:#3A1216; --red-ink:#1A0003;
  --amber:#FFC26B; --amber-soft:#33230C;
  --green:#7FE29A; --green-soft:#10301A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1117; --surface:#15212B; --line:#34444F;
  --ink:#F4F7F9; --ink-2:#DCE3E8;
  --accent:#5FD0D6; --accent-ink:#06232A; --accent-soft:#12343A;
  --red:#FF5A63; --red-soft:#3A1216; --red-ink:#1A0003;
  --amber:#FFC26B; --amber-soft:#33230C;
  --green:#7FE29A; --green-soft:#10301A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:1.3rem;font-weight:800;line-height:1.25}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:14px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:var(--bg);padding:12px 6px;font-weight:700;font-size:1rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* main red button */
.sos{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;border:0;border-radius:20px;padding:20px;background:var(--red);color:var(--red-ink)}
.sos b{font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
.sos span{font-size:1rem;font-weight:500}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:118px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.tile b{font-size:1.08rem;line-height:1.25}
.tile small{font-size:.84rem;color:var(--ink-2)}
.tile .ic{font-size:1.6rem;line-height:1}
.tile.wide{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center}

/* help strip */
.help{border:2px solid var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.help .big{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* sub page */
.back{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--bg);border-radius:14px;padding:10px 16px;font-weight:700;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:10px}
.sym{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;font-weight:600;font-size:1.05rem}
.sym .arr{font-size:1.4rem;color:var(--ink-2)}

.row{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;border:2px solid}
.row .lvl{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.row .act{font-weight:700}
.row.now{background:var(--red-soft);border-color:var(--red)} .row.now .lvl{color:var(--red)}
.row.soon{background:var(--amber-soft);border-color:var(--amber)} .row.soon .lvl{color:var(--amber)}
.row.ok{background:var(--green-soft);border-color:var(--green)} .row.ok .lvl{color:var(--green)}
.row ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}

.card{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.yes,.no,.myth{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.yes:last-child,.no:last-child,.myth:last-child{border-bottom:0}
.mark{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.1rem}
.yes .mark{background:var(--green);color:var(--bg)}
.no .mark{background:var(--red);color:var(--bg)}
.myth .mark{background:var(--ink-2);color:var(--bg)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:2px solid var(--ink);background:var(--bg);border-radius:999px;padding:9px 16px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.tl{display:flex;flex-direction:column}
.tl .st{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tl .st:last-child{border-bottom:0}
.tl .when{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.note{border-left:5px solid var(--accent);background:var(--accent-soft);padding:14px 16px;border-radius:0 14px 14px 0;font-weight:500}

.lochia{display:flex;flex-direction:column;gap:6px}
.lo{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.lo .bar{height:30px;border-radius:8px;display:flex;align-items:center;padding-inline:10px;font-weight:700;font-size:.9rem;border:2px solid var(--line)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}

.src{font-size:.78rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}

/* sticky bottom SOS on sub pages */
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.dock button{display:block;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:14px;padding:14px;background:var(--red);color:var(--red-ink);font-weight:800;font-size:1.05rem}

/* setup */
.pick{display:flex;flex-direction:column;gap:12px}
.pick button{text-align:left;border:2px solid var(--ink);background:var(--bg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:2px}
.pick button b{font-size:1.15rem}
.pick button span{color:var(--ink-2);font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (max-width:360px){.tiles{grid-template-columns:1fr}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="dock" id="dock" hidden><button id="dockBtn" type="button">🚨 Что-то беспокоит?</button></div>

<script>
(function(){
const S = {birth:null, perineum:null, place:'hosp', view:'home', arg:null};
try{const s=JSON.parse(localStorage.getItem('pp_state')||'{}'); if(s.birth)S.birth=s.birth; if(s.perineum)S.perineum=s.perineum; if(s.place)S.place=s.place;}catch(e){}
function save(){try{localStorage.setItem('pp_state',JSON.stringify({birth:S.birth,perineum:S.perineum,place:S.place}))}catch(e){}}

const cs=()=>S.birth==='cs';
const perin=()=>S.birth==='er' && S.perineum!=='no';
const home=()=>S.place==='home';

const ACT = {
  now:()=> home()
    ? 'Сразу обратитесь в приёмное отделение роддома — оно работает круглосуточно. Сильное кровотечение, обморок или трудно дышать — вызывайте скорую 103, не добирайтесь сами.'
    : 'Нажмите кнопку вызова у кровати или попросите соседку позвать акушерку. Если можете идти — на пост.',
  soon:()=> home()
    ? 'Обратитесь сегодня в приёмное отделение роддома. Не откладывайте до приёма в консультации.'
    : 'Скажите акушерке на посту сегодня. Не ждите утреннего обхода.',
  ok:()=> home() ? 'Можно обсудить на приёме у врача.' : 'Можно сказать на ближайшем обходе.'
};
const LVL={now:'Зовите сразу',soon:'Скажите сегодня',ok:'Это нормально'};

/* Symptoms: each row = [level, text items[]]. 'show' filters by mode. */
const SYM = [
 {id:'blood', t:'Кровь, выделения', rows:[
   ['now',['Прокладка промокает насквозь за час или быстрее','Выходят крупные сгустки','Кровь вдруг пошла сильнее, хотя уже уменьшалась']],
   ['soon',['Выделения с неприятным запахом или похожи на гной','Ярко-красные выделения не светлеют дольше недели']],
   ['ok',['1–4 сутки выделения кровяные: так заживает внутренняя поверхность матки','5–8 сутки коричневые, 9–15 желтоватые, потом беловатые','К 5–6 неделе выделения заканчиваются']]]},
 {id:'temp', t:'Температура, озноб', rows:[
   ['now',['38 °C и выше вместе с ознобом, частым сердцебиением, сильной слабостью или спутанностью мыслей']],
   ['soon',['38 °C и выше']],
   ['ok',['В первые сутки после родов до 38 °C бывает от нехватки жидкости. Пейте больше и скажите акушерке','Когда пришло молоко, мерьте после кормления или сцеживания. Если под мышкой выше 37 °C, перемерьте в локтевом сгибе']]]},
 {id:'belly', t:'Боль в животе', rows:[
   ['now',['Сильная тупая боль внизу живота вместе с тошнотой, слабостью, головокружением','Сильная боль по всему животу, рвота','Живот за сутки заметно увеличился']],
   ['soon',['Боль внизу живота не проходит и нарастает, особенно с температурой']],
   ['ok',['Схваткообразные боли, сильнее во время кормления: это сокращается матка','Обезболивающее можно попросить, терпеть не нужно']]]},
 {id:'perin', t:'Шов на промежности', show:()=>S.birth==='er', rows:[
   ['now',['Острая боль в области шва не проходит больше часа','Распирающая, нарастающая боль в промежности или во влагалище','Ощущение чего-то постороннего во влагалище']],
   ['soon',['Из шва выделения с неприятным запахом','Шов покраснел, отёк, уплотнение, гной']],
   ['ok',['Умеренная боль и отёк в первые дни','Холод на промежность по 10 минут в первые 1–2 суток уменьшает боль и отёк']]]},
 {id:'csw', t:'Шов на животе', show:cs, rows:[
   ['now',['Живот за сутки заметно увеличился','Шов разошёлся или из него идёт кровь']],
   ['soon',['Шов покраснел, отёк, горячий на ощупь, уплотнение','Из шва гной или выделения с запахом','Боль в шве с каждым днём сильнее, а не слабее']],
   ['ok',['Тянущая боль в ране в первые дни','Дискомфорт в животе может держаться несколько месяцев: так бывает примерно у 9 из 100 женщин после операции']]]},
 {id:'breast', t:'Грудь', rows:[
   ['soon',['Красный болезненный участок на груди и температура','Грудь сильно распирает, больно, и после кормления не легче','Трещина на соске гноится']],
   ['ok',['Молозиво есть с первого дня, на 2–3 сутки грудь наливается, на 5–6 приходит молоко','Грудь твёрдая и тяжёлая, а после кормления становится мягче: это нормально']]]},
 {id:'pee', t:'Мочеиспускание', rows:[
   ['soon',['Не получилось помочиться за 4–6 часов после родов','Нет позывов, а внизу живота распирает','Жжение и боль при мочеиспускании']],
   ['ok',['Подтекание мочи в первые недели бывает. Помогают упражнения для мышц тазового дна, скажите врачу']]]},
 {id:'stool', t:'Запор, геморрой', rows:[
   ['ok',['Запор в первые дни частое явление. На 2–3 сутки врач назначает слабительное: попросите, если не предложили','Обострение геморроя бывает часто. Есть свечи, мази и компрессионный трикотаж, скажите врачу']]]},
 {id:'head', t:'Голова', rows:[
   ['now',['Сильная головная боль, не проходит после таблетки','Мелькают «мушки», зрение нечёткое']],
   ['ok',['Умеренная головная боль в первые 1–5 суток','Боль в пояснице после эпидуральной анестезии']]]},
 {id:'weak', t:'Слабость, дыхание', rows:[
   ['now',['Обморок, потемнение в глазах, сильное головокружение','Не хватает воздуха, одышка, боль в груди','Сердце колотится в покое']],
   ['ok',['Усталость и слабость в первые дни: спите, когда спит малыш']]]},
 {id:'leg', t:'Нога', rows:[
   ['now',['Одна нога отекла, болит икра, кожа покраснела или горячая']]]},
 {id:'mood', t:'Настроение', rows:[
   ['now',['Появились мысли навредить себе или ребёнку. Скажите сразу: это лечится, вас не осудят']],
   ['soon',['Тоска или тревога каждый день дольше двух недель','Не можете уснуть, даже когда малыш спит']],
   ['ok',['Плаксивость и перепады настроения в первые дни бывают у многих','Помогают сон, движение, помощь близких с малышом']]]},
];

const SRC = 'Источник: клинические рекомендации РОАГ «Нормальный послеродовый период» (2024), «Роды одноплодные, родоразрешение путём КС» (2024), «Разрывы промежности… (акушерский травматизм)» (2023), «Послеродовые инфекционные осложнения» (2024).';

const app=document.getElementById('app'), dock=document.getElementById('dock');
function go(v,arg){S.view=v;S.arg=arg||null;render();window.scrollTo(0,0);try{history.pushState({v,arg},'')}catch(e){}}
window.addEventListener('popstate',e=>{const st=e.state||{v:'home'};S.view=st.v||'home';S.arg=st.arg||null;render()});
document.getElementById('dockBtn').onclick=()=>go('sym');

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const back=(to='home',label='Назад')=>`<button class="back" type="button" data-go="${to}">← ${label}</button>`;
function placeSeg(){return `<div class="seg" role="group" aria-label="Где вы сейчас">
  <button type="button" data-place="hosp" aria-pressed="${!home()}">Я в роддоме</button>
  <button type="button" data-place="home" aria-pressed="${home()}">Я уже дома</button></div>`}

/* ---------- views ---------- */
function vSetup(){
  if(!S.birth) return `<div class="stack">
   <h1>После родов</h1>
   <p class="muted">Ответьте на один вопрос — и увидите только то, что касается вас.</p>
   <h2 style="margin-top:8px">Как вы рожали?</h2>
   <div class="pick">
     <button type="button" data-birth="er"><b>Сама, естественно</b><span>в том числе с вакуумом или разрезом промежности</span></button>
     <button type="button" data-birth="cs"><b>Кесарево сечение</b><span>плановое или экстренное</span></button>
   </div></div>`;
  return `<div class="stack">
   <h2>Есть швы на промежности?</h2>
   <p class="muted">Если не знаете — выберите «Не знаю», спросите акушерку при обходе.</p>
   <div class="pick">
     <button type="button" data-per="yes"><b>Да, есть швы</b></button>
     <button type="button" data-per="no"><b>Нет швов</b></button>
     <button type="button" data-per="unk"><b>Не знаю</b></button>
   </div></div>`;
}

function vHome(){
  const mode = cs()?'Кесарево':'Естественные роды'+(S.perineum==='yes'?' · швы':'');
  return `<div class="stack">
   <div class="top"><h1>После родов</h1><button class="chip" type="button" data-reset>${mode} ✎</button></div>
   ${placeSeg()}
   <button class="sos" type="button" data-go="sym"><b>🚨 Что-то беспокоит?</b><span>Выберите, что болит, — подскажем: звать сразу или это нормально</span></button>
   <div class="tiles">
     <button class="tile" type="button" data-go="rules"><span class="ic">✅</span><b>Можно и нельзя</b><small>еда, движение, гигиена</small></button>
     <button class="tile" type="button" data-go="sutures"><span class="ic">🩹</span><b>${cs()?'Шов после кесарева':'Уход за швами'}</b><small>что делать каждый день</small></button>
     <button class="tile" type="button" data-go="days"><span class="ic">🕐</span><b>Что будет в роддоме</b><small>осмотры, анализы, выписка</small></button>
     <button class="tile" type="button" data-go="breast"><span class="ic">🤱</span><b>Грудь и кормление</b><small>как не допустить застоя</small></button>
     <button class="tile wide" type="button" data-go="after"><span class="ic">🏠</span><div style="display:flex;flex-direction:column;gap:2px"><b>После выписки</b><small>выделения по неделям, врач, секс, контрацепция</small></div></button>
   </div>
   ${helpBox()}
  </div>`;
}

function helpBox(){
  return home()
   ? `<div class="help"><span class="small muted">Если стало плохо дома</span><span style="font-weight:800;font-size:1.25rem">Приёмное отделение роддома</span><span>Работает круглосуточно. Скажите: «родила N дней назад». Не можете добраться сами — скорая 103.</span></div>`
   : `<div class="help"><span class="small muted">Как позвать помощь в роддоме</span><span style="font-weight:700">Кнопка вызова у кровати или пост акушерки</span><span class="small muted">Если тревожно и вы не уверены — лучше позвать. За это никто не ругает.</span></div>`;
}

function vSym(){
  const items=SYM.filter(s=>!s.show||s.show());
  return `${back()}<div class="stack">
    <h2>Что беспокоит?</h2>
    ${placeSeg()}
    <div class="list">${items.map(s=>`<button class="sym" type="button" data-go="symd" data-arg="${s.id}"><span>${s.t}</span><span class="arr">›</span></button>`).join('')}</div>
    <p class="small muted">Не нашли своё, но тревожно? ${home()?'Обратитесь в приёмное отделение роддома.':'Позовите акушерку.'}</p>
  </div>`;
}

function vSymD(id){
  const s=SYM.find(x=>x.id===id); if(!s) return vSym();
  return `${back('sym','Все симптомы')}<div class="stack">
    <h2>${s.t}</h2>
    ${s.rows.map(([l,items])=>`<div class="row ${l}">
       <span class="lvl">${LVL[l]}</span>
       <ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>
       <span class="act">→ ${ACT[l]()}</span></div>`).join('')}
    <p class="src">${SRC}</p></div>`;
}

let rulesTab='yes';
function vRules(){
  const Y=[
    ['Пить','Сразу после родов, сколько хочется'+(cs()?'. После общего наркоза — через 2 часа':'')+'.'],
    ['Есть', cs()
      ? 'С 3-го часа после операции — обычная еда, кроме хлеба, овощей и фруктов. После общего наркоза: бульон через 4–6 часов, обычная еда через сутки.'
      : 'Через несколько часов после родов.'],
    ['Питаться часто','5–6 раз в день: 3 основных приёма и 2–3 перекуса.'],
    ['Вставать', cs()
      ? 'Через 4–6 часов после операции: сначала сесть в постели, спустить ноги, потом понемногу ходить. Первый раз — с персоналом.'
      : (perin()?'Вставать и ложиться через бок, не садясь.':'Вставать и ходить, когда почувствуете себя готовой.')],
    ['Душ','Каждый день. Подмываться 2–3 раза в день. Бельё менять каждый день.'],
    ['Кормить по требованию','Не ограничивать время у груди. Малыш рядом с вами круглосуточно.'],
    ['Просить обезболивающее','Терпеть боль не нужно: обезболивание входит в лечение.'],
    ['Упражнения для тазового дна','Помогают восстановиться и не допустить подтекания мочи.'],
  ];
  const N=[
    perin()?['Сидеть 7–14 дней','При швах на промежности. Можно лежать, стоять, ходить. Вставать и ложиться — через бок.']:null,
    ['Поднимать тяжёлое', cs()?'Ничего тяжелее ребёнка 4–6 недель: так лучше заживает шов на животе.':'Больше 5 кг.'],
    ['Алкоголь','Совсем, даже если не кормите грудью.'],
    ['Сырое и недожаренное','Шашлык с кровью, суши, сырое молоко, утиные и гусиные яйца.'],
    ['Голодать и сидеть на диете','Кормящей маме нужно не меньше 1500 ккал в день.'],
    ['Много молочного','На молоко не влияет, но у малыша может быть аллергия или колики.'],
    ['Утягивать грудь','Ремень безопасности, тугая лямка слинга, бинтование — всё это ведёт к застою молока.'],
    ['Лечить грудь самой','При боли, покраснении и температуре — к врачу.'],
    ['Секс','6–8 недель или пока не закончатся выделения.'],
  ].filter(Boolean);
  const M=[
    ['Гипоаллергенная диета','Не защищает малыша от аллергии.'],
    ['Лактогонные травы','Не увеличивают количество молока.'],
    ['Пить через силу «для молока»','Пейте, сколько хочется. Больше воды — не больше молока.'],
    cs()?['Мазать шов антисептиком каждый день','Достаточно душа.']:null,
  ].filter(Boolean);
  const list = rulesTab==='yes'?Y:rulesTab==='no'?N:M;
  const cls = rulesTab==='yes'?'yes':rulesTab==='no'?'no':'myth';
  const mk = rulesTab==='yes'?'✓':rulesTab==='no'?'✕':'?';
  return `${back()}<div class="stack"><h2>Можно и нельзя</h2>
   <div class="tabs" role="group">
     <button type="button" data-rt="yes" aria-pressed="${rulesTab==='yes'}">✓ Можно</button>
     <button type="button" data-rt="no" aria-pressed="${rulesTab==='no'}">✕ Нельзя</button>
     <button type="button" data-rt="myth" aria-pressed="${rulesTab==='myth'}">Не нужно</button>
   </div>
   <div class="card">${list.map(([h,d])=>`<div class="${cls}"><span class="mark">${mk}</span><div><h3>${h}</h3><p class="muted">${d}</p></div></div>`).join('')}</div>
   <p class="src">${SRC}</p></div>`;
}

function vSutures(){
  let body;
  if(cs()){
    body=`<div class="card"><h3>Какой у меня шов</h3><p>Чаще всего косметический, нитки рассасываются сами и полностью исчезают примерно за 60 дней. Если нитки нужно снять — это сделают в роддоме или после выписки.</p></div>
    <h3>Что делать</h3>
    <ol class="steps">
      <li><span>Повязку снимают через 6 часов после операции. Без повязки шов заживает лучше.</span></li>
      <li><span>Дальше — душ каждый день. Шов моется обычной водой, мазать антисептиком не нужно.</span></li>
      <li><span>Компрессионные чулки носите всё время после операции: это защита от тромбов.</span></li>
      <li><span>Вставайте через бок: повернуться на бок, спустить ноги, оттолкнуться руками.</span></li>
      <li><span>Ничего тяжелее ребёнка 4–6 недель.</span></li>
    </ol>`;
  } else {
    body=`<div class="card"><h3>Какие бывают швы</h3>
      <p><b>Внутренние</b> (влагалище, шейка матки) — всегда рассасывающиеся, снимать не нужно.</p>
      <p><b>Наружные</b> (промежность) — рассасывающиеся или снимаются примерно через 5 дней. Какие у вас — спросите акушерку.</p></div>
    <h3>Что делать</h3>
    <ol class="steps">
      <li><span>Холод на промежность по 10 минут в первые 1–2 суток — меньше боли и отёка.</span></li>
      <li><span>Подмываться 2–3 раза в день и после туалета, душ каждый день. Бельё менять каждый день.</span></li>
      <li><span>Не сидеть 7–14 дней. Вставать и ложиться через бок: лечь на бок, спустить ноги, оттолкнуться руками.</span></li>
      <li><span>Не тужиться в туалете. На 2–3 сутки врач назначает слабительное — попросите, если не предложили.</span></li>
      <li><span>Обезболивающее просите, терпеть не нужно.</span></li>
    </ol>`;
  }
  return `${back()}<div class="stack"><h2>${cs()?'Шов после кесарева':'Уход за швами'}</h2>${body}
   <button class="sos" type="button" data-go="symd" data-arg="${cs()?'csw':'perin'}"><b>Со швом что-то не так?</b><span>Проверить, когда звать</span></button>
   <p class="src">${SRC}</p></div>`;
}

function vDays(){
  const st = cs() ? [
    ['Сразу','Вас наблюдают на мониторе: первые 2 часа каждые 20–30 минут, потом каждые 2–3 часа.'],
    ['Сразу','Можно пить. Малыша могут приложить к груди ещё в операционной.'],
    ['3 часа','Можно есть обычную еду, кроме хлеба, овощей и фруктов.'],
    ['4–6 часов','Помогут сесть, спустить ноги и встать. Катетер из мочевого пузыря уберут, когда начнёте вставать.'],
    ['6 часов','Снимают повязку со шва.'],
    ['1-е сутки','Температура до 38 °C бывает. Пейте больше и скажите акушерке.'],
    ['Каждый день','Врач осматривает 1 раз в день: давление, пульс, матку, выделения, шов, грудь, ноги.'],
    ['2–3 сутки','Анализ крови. Приходит молоко.'],
    ['3 сутки','УЗИ матки.'],
    ['Выписка','Когда нет осложнений и застоя молока. Вам дадут паспорт операции — сохраните его.'],
  ] : [
    ['2 часа','Вы в родзале. Каждые 15 минут проверяют давление, пульс, матку, выделения.'],
    ['4–6 часов','Нужно помочиться самой. Не получается — скажите акушерке.'],
    ['Каждый день','Врач осматривает 1 раз в день, акушерка — 2 раза: давление, пульс, матка, выделения, швы, грудь, ноги, температура.'],
    ['2–3 сутки','Анализ крови. Приходит молоко. Слабительное, если нужно.'],
    ['3 сутки','УЗИ матки.'],
    ['Выписка','Когда нет осложнений, остатков плаценты в матке и застоя молока.'],
  ];
  return `${back()}<div class="stack"><h2>Что будет в роддоме</h2>
   <div class="note">Если всё идёт хорошо, врач заходит раз в день, акушерка — два раза. Между осмотрами к вам могут не заходить: это не значит, что о вас забыли. Если что-то тревожит — зовите сами.</div>
   <div class="tl">${st.map(([w,t])=>`<div class="st"><span class="when">${w}</span><span>${t}</span></div>`).join('')}</div>
   <p class="src">${SRC}</p></div>`;
}

function vBreast(){
  return `${back()}<div class="stack"><h2>Грудь и кормление</h2>
   <div class="tl">
     <div class="st"><span class="when">1 сутки</span><span>Молозиво. Его мало, и это нормально: малышу хватает.</span></div>
     <div class="st"><span class="when">2–3 сутки</span><span>Грудь наливается, может распирать.</span></div>
     <div class="st"><span class="when">5–6 сутки</span><span>Приходит молоко.</span></div>
   </div>
   <h3>Каждый день</h3>
   <ol class="steps">
     <li><span>Кормите по требованию. Перерыв не больше 3 часов, даже ночью.</span></li>
     <li><span>Перед кормлением мойте руки и грудь водой.</span></li>
     <li><span>Бельё для кормящих, ничего не давит на грудь.</span></li>
   </ol>
   <h3>Если грудь распирает</h3>
   <ol class="steps">
     <li><span>Сразу приложите малыша или сцедитесь.</span></li>
     <li><span>Кормите чаще — каждые полтора часа.</span></li>
     <li><span>Начинайте с больной груди. Если слишком больно — со здоровой, потом переходите.</span></li>
     <li><span>Подбородок и нос малыша — напротив твёрдого участка.</span></li>
     <li><span>Перед кормлением мягко погладьте грудь к соску. Не мните с силой.</span></li>
     <li><span>Сцеживайте до облегчения, не до пустой груди.</span></li>
   </ol>
   <div class="row soon"><span class="lvl">Скажите сегодня</span><ul><li>Покраснение, сильная боль, температура</li></ul><span class="act">→ ${ACT.soon()} Самолечение нельзя.</span></div>
   <div class="note">Трудно прикладывать? Попросите акушерку показать — это её работа, а не каприз.</div>
   <p class="src">${SRC}</p></div>`;
}

function vAfter(){
  const lo=[['1–4 день','var(--red-soft)','Кровяные'],['5–8 день','var(--amber-soft)','Коричневые'],['9–15 день','var(--amber-soft)','Желтоватые'],['16–20 день','var(--surface)','Беловатые'],['3–4 неделя','var(--surface)','Скудные, со слизью'],['5–6 неделя','var(--green-soft)','Заканчиваются']];
  return `${back()}<div class="stack"><h2>После выписки</h2>
   <h3>Выделения по дням</h3>
   <div class="lochia">${lo.map(([d,c,t])=>`<div class="lo"><span class="small" style="font-weight:700">${d}</span><span class="bar" style="background:${c}">${t}</span></div>`).join('')}</div>
   <p class="small muted">Кровяные выделения затянулись — к врачу.</p>
   <div class="card">
     <h3>Врачи</h3>
     <p>Акушер-гинеколог через ${cs()?'1–1,5 месяца':'30–45 дней'} после родов. Терапевт в те же сроки, если есть хронические болезни.</p>
   </div>
   <div class="card">
     <h3>Движение и отдых</h3>
     <p>Возвращайтесь к делам постепенно. Цель — 150 минут спокойной активности в неделю (ходьба), сон около 8 часов, еда не меньше 1500 ккал в день. Тяжёлое: ${cs()?'не тяжелее ребёнка 4–6 недель':'не больше 5 кг'}.</p>
   </div>
   <div class="card">
     <h3>Секс и контрацепция</h3>
     <p>Секс — через 6–8 недель или когда закончатся выделения.</p>
     <p>Забеременеть можно ещё до первых месячных. Кормление грудью защищает, только если одновременно: кормите только грудью, месячных нет, прошло меньше 6 месяцев. И даже так — ненадёжно.</p>
     <p>Презервативы и таблетки — с 6 недель. Спираль можно поставить сразу после родов. Метод подберёт врач.</p>
   </div>
   <div class="card">
     <h3>Следующая беременность</h3>
     <p>${cs()?'Не раньше чем через 12–18 месяцев, после УЗИ рубца на матке.':'Лучший промежуток между родами — 2 года.'}</p>
   </div>
   <div class="card"><h3>Месячные</h3><p>Если не кормите грудью — вернутся через 6–8 недель. У большинства кормящих их нет всё время кормления.</p></div>
   <button class="sos" type="button" data-go="sym" data-place-home="1"><b>🚨 Плохо дома?</b><span>Проверить симптом</span></button>
   <p class="src">${SRC}</p></div>`;
}

function render(){
  let h;
  if(!S.birth || (S.birth==='er' && !S.perineum)) {h=vSetup(); dock.hidden=true;}
  else{
    switch(S.view){
      case 'sym':h=vSym();break; case 'symd':h=vSymD(S.arg);break;
      case 'rules':h=vRules();break; case 'sutures':h=vSutures();break;
      case 'days':h=vDays();break; case 'breast':h=vBreast();break; case 'after':h=vAfter();break;
      default:h=vHome();
    }
    dock.hidden = (S.view==='home'||S.view==='sym'||S.view==='symd');
  }
  app.innerHTML=`<div class="view">${h}</div>`;
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.birth){S.birth=d.birth; if(d.birth==='cs')S.perineum='no'; else S.perineum=null; save(); S.view='home'; render(); return;}
  if(d.per){S.perineum=d.per; save(); S.view='home'; render(); return;}
  if('reset' in d){S.birth=null;S.perineum=null;save();render();return;}
  if(d.place){S.place=d.place;save();render();return;}
  if(d.rt){rulesTab=d.rt;render();return;}
  if(d.placeHome){S.place='home';save();}
  if(d.go){go(d.go,d.arg);}
});
try{history.replaceState({v:'home'},'')}catch(e){}
render();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
